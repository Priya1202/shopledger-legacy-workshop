<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture</title>
  <desc id="desc">A component map of ShopLedger and numbered order placement flow, highlighting invoice and tax modules.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
      .title { font-size: 24px; font-weight: 700; }
      .subtitle { font-size: 13px; fill: #475569; }
      .head { font-size: 15px; font-weight: 700; }
      .body { font-size: 12px; }
      .small { font-size: 12px; fill: #475569; }
      .box { fill: #fff; stroke: #94a3b8; stroke-width: 1.4; rx: 9; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; rx: 12; }
      .ticket { fill: #fff4e6; stroke: #e07a19; stroke-width: 2; rx: 9; }
      .ticketSoft { fill: #fffaf2; stroke: #e7a34e; stroke-width: 1.6; rx: 9; }
      .link { fill: none; stroke: #64748b; stroke-width: 1.5; marker-end: url(#arrow); }
      .flow { fill: none; stroke: #2563eb; stroke-width: 2; marker-end: url(#arrowBlue); }
      .num { fill: #2563eb; stroke: #fff; stroke-width: 1.4; }
      .numText { fill: #fff; font-size: 12px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>

  <rect width="1200" height="800" fill="#ffffff"/>
  <text x="30" y="38" class="title">ShopLedger | application architecture</text>
  <text x="30" y="59" class="subtitle">Browser POS · Express API · file-backed JSON store · GST invoice and reconciliation</text>

  <!-- Component map -->
  <rect x="24" y="78" width="1152" height="366" class="panel"/>

  <rect x="42" y="112" width="190" height="252" class="box"/>
  <text x="58" y="138" class="head">Browser UI</text>
  <text x="58" y="158" class="body">public/</text>
  <text x="58" y="185" class="body">index.html · js/app.js</text>
  <text x="58" y="205" class="body">css/style.css</text>
  <text x="58" y="239" class="small">Cart preview / order form</text>
  <text x="58" y="258" class="small">Order history / Khata</text>
  <text x="58" y="277" class="small">Inventory &amp; GST audit</text>
  <text x="58" y="316" class="small">POST /api/orders</text>
  <text x="58" y="335" class="small">GET /orders/:id/invoice</text>

  <rect x="280" y="112" width="184" height="252" class="box"/>
  <text x="296" y="138" class="head">server.js</text>
  <text x="296" y="160" class="body">Express app</text>
  <text x="296" y="183" class="small">JSON body parser</text>
  <text x="296" y="202" class="small">Serves public/</text>
  <text x="296" y="230" class="small">Mounts routers at /api</text>
  <text x="296" y="258" class="small">Invoice GET handler</text>
  <text x="296" y="286" class="small">Reads order → renders</text>
  <text x="296" y="305" class="small">lib/invoice.js</text>

  <rect x="510" y="96" width="275" height="332" class="box"/>
  <text x="526" y="122" class="head">routes/ (mounted at /api)</text>
  <text x="526" y="151" class="body">products.js</text>
  <text x="650" y="151" class="small">products, coupons</text>
  <text x="526" y="184" class="body">orders.js</text>
  <text x="650" y="184" class="small">order list/get/post/cancel</text>
  <text x="526" y="217" class="body">customers.js</text>
  <text x="650" y="217" class="small">Khata, settlements</text>
  <text x="526" y="250" class="body">reports.js</text>
  <text x="650" y="250" class="small">dashboard, preview, export</text>
  <path d="M526 267 H768" stroke="#e2e8f0"/>
  <text x="526" y="291" class="small">Order POST coordinates checkout</text>
  <text x="526" y="312" class="small">Calls inventory, pricing, coupons,</text>
  <text x="526" y="331" class="small">ledger, orders and store modules</text>
  <text x="526" y="387" class="small">pricing preview → pricing / coupons</text>

  <rect x="810" y="96" width="344" height="332" class="box"/>
  <text x="826" y="122" class="head">lib/ business modules</text>
  <text x="826" y="150" class="body">pricing.js</text>
  <text x="966" y="150" class="body">coupons.js</text>
  <text x="826" y="177" class="body">inventory.js</text>
  <text x="966" y="177" class="body">orders.js</text>
  <text x="826" y="204" class="body">ledger.js</text>
  <text x="966" y="204" class="body">store.js</text>
  <text x="826" y="231" class="body">reports.js</text>
  <text x="966" y="231" class="body">dates.js</text>
  <rect x="816" y="248" width="330" height="69" class="ticket"/>
  <text x="830" y="271" class="head" fill="#9a4d00">invoice.js</text>
  <text x="930" y="271" class="small">computeInvoiceFigures · render</text>
  <rect x="816" y="326" width="330" height="81" class="ticketSoft"/>
  <text x="830" y="350" class="head" fill="#9a4d00">tax.js</text>
  <text x="900" y="350" class="small">getRateForItem · splitCgstSgst</text>
  <text x="830" y="378" class="small">pricing.js resolves GST slabs through tax.js</text>
  <text x="830" y="396" class="small">invoice.js currently calculates separately</text>

  <rect x="280" y="382" width="184" height="46" class="box"/>
  <text x="296" y="402" class="body" font-weight="700">config.js</text>
  <text x="296" y="419" class="small">shop · coupons · GST slabs</text>

  <rect x="42" y="382" width="190" height="46" class="box"/>
  <text x="58" y="402" class="body" font-weight="700">data/db.json</text>
  <text x="58" y="419" class="small">products · orders · customers</text>

  <!-- Architecture relationships -->
  <path d="M232 218 H280" class="link"/>
  <path d="M464 218 H510" class="link"/>
  <path d="M785 218 H810" class="link"/>
  <path d="M900 248 V235" class="link"/>
  <path d="M1010 326 V317" class="link"/>
  <path d="M371 364 V382" class="link"/>
  <path d="M900 428 V452 H232 V405" class="link"/>
  <path d="M900 428 V462 H372 V428" class="link"/>
  <text x="526" y="462" class="small">lib/store.js reads/writes db.json</text>
  <text x="840" y="462" class="small">pricing.js + tax.js use config.js slabs</text>
  <text x="58" y="462" class="small">Legend:</text>
  <rect x="111" y="450" width="18" height="16" class="ticket"/>
  <text x="137" y="463" class="small">Ticket focus: invoice.js</text>
  <rect x="290" y="450" width="18" height="16" class="ticketSoft"/>
  <text x="316" y="463" class="small">tax.js shown because checkout pricing calls it</text>

  <!-- Numbered checkout flow -->
  <text x="30" y="502" class="head">Order placement flow</text>
  <text x="30" y="522" class="subtitle">Numbers follow POST /api/orders in routes/orders.js; arrows show the main sequence.</text>

  <rect x="34" y="544" width="250" height="82" class="box"/>
  <circle cx="52" cy="561" r="12" class="num"/><text x="52" y="561" class="numText">1</text>
  <text x="72" y="566" class="head">Build cart payload</text>
  <text x="50" y="590" class="body">public/js/app.js → POST /api/orders</text>
  <text x="50" y="610" class="small">items, customer, mode, coupon</text>

  <rect x="318" y="544" width="250" height="82" class="box"/>
  <circle cx="336" cy="561" r="12" class="num"/><text x="336" y="561" class="numText">2</text>
  <text x="356" y="566" class="head">Resolve and validate</text>
  <text x="334" y="590" class="body">store.read → inventory.find</text>
  <text x="334" y="610" class="small">check item IDs and quantities</text>

  <rect x="602" y="544" width="250" height="82" class="box"/>
  <circle cx="620" cy="561" r="12" class="num"/><text x="620" y="561" class="numText">3</text>
  <text x="640" y="566" class="head">Validate coupon</text>
  <text x="618" y="590" class="body">coupons.normalizeCode / validate</text>
  <text x="618" y="610" class="small">minimum, active, code checks</text>

  <rect x="886" y="544" width="280" height="82" class="ticketSoft"/>
  <circle cx="904" cy="561" r="12" class="num"/><text x="904" y="561" class="numText">4</text>
  <text x="924" y="566" class="head">Calculate checkout totals</text>
  <text x="902" y="590" class="body">pricing.subtotal / computeTotals</text>
  <text x="902" y="610" class="small">discount apportionment + HSN GST</text>

  <path d="M284 585 H318" class="flow"/>
  <path d="M568 585 H602" class="flow"/>
  <path d="M852 585 H886" class="flow"/>

  <rect x="886" y="664" width="280" height="82" class="box"/>
  <circle cx="904" cy="681" r="12" class="num"/><text x="904" y="681" class="numText">5</text>
  <text x="924" y="686" class="head">Charge Khata if selected</text>
  <text x="902" y="710" class="body">ledger.chargeOrderToKhata</text>
  <text x="902" y="730" class="small">customer balance / credit limit</text>

  <rect x="602" y="664" width="250" height="82" class="box"/>
  <circle cx="620" cy="681" r="12" class="num"/><text x="620" y="681" class="numText">6</text>
  <text x="640" y="686" class="head">Update stock</text>
  <text x="618" y="710" class="body">inventory.reserve</text>
  <text x="618" y="730" class="small">deduct sold quantities</text>

  <rect x="318" y="664" width="250" height="82" class="box"/>
  <circle cx="336" cy="681" r="12" class="num"/><text x="336" y="681" class="numText">7</text>
  <text x="356" y="686" class="head">Create order + audit</text>
  <text x="334" y="710" class="body">orders.add · store.appendAudit</text>
  <text x="334" y="730" class="small">record order and summary figures</text>

  <rect x="34" y="664" width="250" height="82" class="box"/>
  <circle cx="52" cy="681" r="12" class="num"/><text x="52" y="681" class="numText">8</text>
  <text x="72" y="686" class="head">Persist and respond</text>
  <text x="50" y="710" class="body">store.write → data/db.json</text>
  <text x="50" y="730" class="small">return order JSON (HTTP 201)</text>

  <path d="M1026 626 V645 H1026 V664" class="flow"/>
  <path d="M886 705 H852" class="flow"/>
  <path d="M602 705 H568" class="flow"/>
  <path d="M318 705 H284" class="flow"/>

  <text x="30" y="780" class="small">Invoice path: server.js GET /orders/:id/invoice → orders.get → invoice.render → computeInvoiceFigures.</text>
</svg>
